name: OpenAI Solar Tunnel
version: "0.3.1"
slug: openai_solar_tunnel
description: Connect selected Home Assistant and Ultrahuman data to an OpenAI Secure MCP Tunnel
url: https://github.com/StephenChapman76/home-assistant-solar
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
options:
  tunnel_id: null
  openai_runtime_api_key: null
  ultrahuman_api_token: null
schema:
  tunnel_id: "match(^tunnel_[0-9a-f]{32}$)"
  openai_runtime_api_key: password
  ultrahuman_api_token: password
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Tunnel health endpoint; disabled on the host by default
watchdog: http://[HOST]:[PORT:8080]/healthz
